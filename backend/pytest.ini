[pytest]
# Pytest configuration for Expense Tracker Backend

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 6.0

# Add current directory to Python path
pythonpath = .

# Async support
asyncio_mode = auto

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings
    --color=yes
    --durations=10

# Markers
markers =
    asyncio: mark test as an async test
    slow: mark test as slow running (>1s)
    integration: mark test as integration test
    unit: mark test as unit test
    auth: tests related to authentication
    expenses: tests related to expenses
    services: tests related to services
    websocket: tests related to websocket connections

# Coverage options (if using pytest-cov)
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (if using pytest-timeout)
timeout = 300
timeout_method = thread